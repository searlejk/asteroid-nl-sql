<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asteroid Q&amp;A</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" class="logo-orbit"/>
          <path class="logo-rock" d="M10 13c1-4 6-6 10-4s5 6 3 9-6 6-10 4-4-5-3-9z"/>
          <circle cx="15" cy="14" r="1.6" class="logo-crater"/><circle cx="19" cy="18" r="1.1" class="logo-crater"/>
        </svg>
        <div>
          <h1>Asteroid Q&amp;A</h1>
          <p class="sub">Ask NASA's asteroid data anything, in plain English.</p>
        </div>
      </div>
      <div id="stats" class="stats">Loading database…</div>
    </header>

    <form id="ask-form" autocomplete="off">
      <div class="ask-row">
        <input id="question" type="text" maxlength="500"
               placeholder="e.g. How many asteroids will pass closer than the Moon this decade?" autofocus>
        <button id="ask-btn" type="submit">Ask</button>
      </div>
      <div class="controls">
        <label>Prompting strategy
          <select id="strategy"></select>
        </label>
        <span id="model" class="pill"></span>
        <span class="pill ok" title="The database is opened read-only; only SELECT queries can run.">read-only</span>
      </div>
      <div id="examples" class="examples"></div>
    </form>

    <section id="thread" aria-live="polite"></section>
  </main>

  <template id="card-tpl">
    <article class="card">
      <div class="q"></div>
      <div class="a"></div>
      <details class="sql-box">
        <summary>SQL query <span class="meta"></span></summary>
        <pre><code></code></pre>
        <div class="attempts"></div>
        <div class="rejected"></div>
      </details>
      <details class="table-box">
        <summary>Results <span class="rowcount"></span></summary>
        <div class="table-wrap"><table></table></div>
      </details>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
